# XcodeGen spec。Mac 上执行: xcodegen generate --spec xcode/project.yml
# 生成 xcode/米帧盒播放器.xcodeproj，然后 xcodebuild archive。
# 零第三方依赖：SwiftUI / AVKit / CryptoKit / Security / AdServices 均为系统框架。
name: 米帧盒播放器

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfiguration: Release

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config-Debug.xcconfig
  Release: Config-Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 只支持 iPhone，省掉 13" iPad 截图；要上架 iPad 改成 "1,2" 并补 iPad 截图。
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # 二进制/模块名用 ASCII，避免在 Xcode 里出现中文模块名带来的编译问题；
    # 用户可见名称（桌面图标、商店名）由 Info.plist 的 CFBundleDisplayName 决定。
    PRODUCT_NAME: 米帧盒播放器
    PRODUCT_MODULE_NAME: MizhenhePlayerApp
    SWIFT_EMIT_LOC_STRINGS: "YES"
  configs:
    Debug:
      INFOPLIST_FILE: "$(SRCROOT)/Info-Debug.plist"
      SWIFT_ACTIVE_COMPILE_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      INFOPLIST_FILE: "$(SRCROOT)/Info.plist"
      # 上架包完全不引用 ASIdentifierManager，隐私问卷不需要声明追踪/IDFA。
      SWIFT_ACTIVE_COMPILE_CONDITIONS: MZH_NO_AD_TRACKING
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ONLY_ACTIVE_ARCH: "NO"

targets:
  米帧盒播放器:
    type: application
    platform: iOS
    sources:
      - path: ../ios
        excludes:
          - "*.md"
          - "*.plist"
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(MZH_BUNDLE_ID)"
        DEVELOPMENT_TEAM: "$(MZH_TEAM_ID)"
        MARKETING_VERSION: "$(MZH_VERSION)"
        CURRENT_PROJECT_VERSION: "$(MZH_BUILD_NUMBER)"
        # 隐私清单必须被打进 App Bundle 根目录
        COPY_RESOURCES_FROM_STATIC_FRAMEWORKS: "YES"

schemes:
  米帧盒播放器:
    build:
      targets:
        米帧盒播放器: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
