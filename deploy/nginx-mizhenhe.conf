# 米帧盒播放器后端 · Nginx 反代片段
# 由 install.sh 复制到 /etc/nginx/snippets/mizhenhe.conf，
# 并在 app.kqi.ink 的 443 server block 内 include。
# 复用现有域名与证书，不需要新子域、不需要新备案、不需要新证书。
#
# 路径映射： https://app.kqi.ink/mzh/<path>  ->  http://127.0.0.1:8790/<path>
# rewrite + 无 URI 的 proxy_pass 会把 /mzh 前缀剥掉；
# X-Forwarded-Prefix 让后端生成带 /mzh 的下单地址与页面内 API 基址。

location = /mzh {
    return 302 /mzh/;
}

# 直接打开 /mzh/ 时给个可见入口（页面右上角有「渠道展示后台」链接）。
location = /mzh/ {
    return 302 /mzh/demo;
}

# 会话鉴权子请求：显式转发到本机 PHP 端点。
# 不能直接写 auth_request /mizhenhe-auth/index —— 子请求走 try_files 内部重定向后
# REQUEST_URI 会变成 /index.php，Yii2 解析不到路由返回 404，nginx 就会报 500。
location = /mzh-auth {
    internal;
    proxy_pass http://127.0.0.1:80/mizhenhe-auth/index;
    proxy_pass_request_body off;
    proxy_set_header Host localhost;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Content-Length "";
    proxy_set_header X-MZH-Auth-Check 1;
}

# 管理后台：与 /site 后台共用同一登录会话（nginx auth_request → Yii2 鉴权端点）。
# 未登录 → 302 到 /site/auth/login，不再需要第二套 Basic Auth 账号。
# X-MZH-Admin 只由通过鉴权的这条代理链路注入，Python 后端据此下发写操作令牌。
location ^~ /mzh/admin {
    auth_request /mzh-auth;
    error_page 401 403 = @mzh_login;

    rewrite ^/mzh/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mzh;
    proxy_set_header X-MZH-Admin 1;
    proxy_read_timeout 30s;
}

# 未登录直接打开 /mzh/admin 时回原后台登录页
location @mzh_login {
    return 302 /site/auth/login;
}

# 试看视频等媒体素材：独立静态目录，nginx 原生支持 Range(206)，
# iOS AVPlayer / 浏览器可以边下边播、拖动进度。文件放在 /opt/mizhenhe/media/。
location ^~ /mzhmedia/ {
    alias /opt/mizhenhe/media/;
    types {
        video/mp4        mp4 m4v;
        video/quicktime  mov;
        image/jpeg       jpg jpeg;
        image/png        png;
        image/webp       webp;
        text/plain       txt;
    }
    default_type application/octet-stream;
    # nginx 原生已发 Accept-Ranges: bytes；再 add_header 会重复，
    # iOS AVPlayer 解析 Range 头时可能退化成整文件下载，起播慢十几秒。
    # 小体积素材 + 短缓存，避免手机一直读旧的大文件缓存。
    add_header Access-Control-Allow-Origin * always;
    expires 1h;
    # 单独记录视频 Range 请求：试看黑屏时可直接确认手机是否真的取到了字节。
    access_log /var/log/nginx/mzh_media.log;
}

# 公开接口 / Demo / 落地页 / 订单页
location ^~ /mzh/ {
    rewrite ^/mzh/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mzh;
    proxy_read_timeout 30s;
}
